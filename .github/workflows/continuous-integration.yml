name: Continuous Integration

on:
  schedule:
    # Daily: publishes an image for each new Caddy release and rescans for Go
    # vulnerabilities.
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

jobs:
  go-build-and-test:
    runs-on: ubuntu-latest
    name: "Run go tests"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build -v

      - name: Test
        run: go test -v

  build-with-xcaddy-and-push:
    runs-on: ubuntu-latest
    name: "Build with xcaddy, scan, and push to GHCR"
    # Serialize publishing so branch, tag and scheduled runs cannot interleave.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      # This job holds the image signing key, so its actions are pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the latest Caddy release
        id: caddy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Docker image with xcaddy
        env:
          CADDY_VERSION: ${{ steps.caddy.outputs.version }}
        run: docker build --pull --build-arg CADDY_VERSION="$CADDY_VERSION" -t caddy-cloudflare:build .

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Scans the exact binary that would ship: Caddy, this module, their
      # dependencies and the Go standard library compiled into it. Like
      # Trivy's --ignore-unfixed, only vulnerable code that has a fix fails.
      - name: Scan the Caddy binary for Go vulnerabilities
        id: govulncheck
        run: |
          container=$(docker create caddy-cloudflare:build)
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$container" > /dev/null
          # The text report exits 3 when it lists findings. JSON mode exits 0
          # unless the scan itself fails, which stops the job before publishing.
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/caddy" || true
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary -format json "$RUNNER_TEMP/caddy" > "$RUNNER_TEMP/govulncheck.json"
          fixable=$(jq -sc '[.[] | select(.finding and .finding.trace[0].function != null
            and (.finding.fixed_version // "") != "") | .finding.osv] | unique' "$RUNNER_TEMP/govulncheck.json")
          echo "Fixable vulnerabilities in the binary: $fixable"
          echo "fixable=$fixable" >> "$GITHUB_OUTPUT"

      # Branch pushes publish by commit; tags publish as themselves. Scheduled
      # and manual runs publish a Caddy release that has no image yet.
      - name: Choose the image tag to publish
        id: publish
        env:
          CADDY_VERSION: ${{ steps.caddy.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
            echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! docker buildx imagetools inspect "$IMAGE_NAME:$CADDY_VERSION" > /dev/null 2>&1; then
              echo "tag=$CADDY_VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.tag
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag the scanned image
        if: steps.publish.outputs.tag
        env:
          TAG: ${{ steps.publish.outputs.tag }}
        run: docker tag caddy-cloudflare:build "$IMAGE_NAME:$TAG"

      # Keep latest signed and prevent stale branch builds from rolling it back.
      - name: Publish signed image
        id: push
        uses: 0xmichalis/repo-tooling/actions/publish-image@ed1b0c7db2764f49a7144c7eff80351a90b65ded # v1.0.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.publish.outputs.tag }}
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
          token: ${{ github.token }}
          require-current-head: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        if: steps.publish.outputs.tag

      # Publishing does not wait for a fix, but the run still fails so the
      # finding is reported.
      - name: Report Go vulnerabilities
        if: steps.govulncheck.outputs.fixable != '[]'
        env:
          FIXABLE: ${{ steps.govulncheck.outputs.fixable }}
        run: |
          echo "::error::govulncheck found fixable vulnerabilities in the Caddy binary: $FIXABLE"
          exit 1
