name: Continuous Integration

on:
  schedule:
    # Daily: publishes an image for each new Caddy release and rescans for Go
    # vulnerabilities.
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

jobs:
  go-build-and-test:
    runs-on: ubuntu-latest
    name: "Run go tests"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build -v

      - name: Test
        run: go test -v

  build-with-xcaddy-and-push:
    runs-on: ubuntu-latest
    name: "Build with xcaddy, scan, and push to GHCR"
    # Serialize publishing so tag and scheduled runs cannot interleave.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      # This job holds the image signing key, so its actions are pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the latest Caddy release
        id: caddy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Docker image with xcaddy
        env:
          CADDY_VERSION: ${{ steps.caddy.outputs.version }}
        run: docker build --pull --build-arg CADDY_VERSION="$CADDY_VERSION" -t caddy-cloudflare:build .

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Scans the exact binary that would ship: Caddy, this module, their
      # dependencies and the Go standard library compiled into it. Like
      # Trivy's --ignore-unfixed, only vulnerable code that has a fix fails.
      - name: Scan the Caddy binary for Go vulnerabilities
        id: govulncheck
        run: |
          container=$(docker create caddy-cloudflare:build)
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$container" > /dev/null
          # The text report exits 3 when it lists findings. JSON mode exits 0
          # unless the scan itself fails, which stops the job before publishing.
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/caddy" || true
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary -format json "$RUNNER_TEMP/caddy" > "$RUNNER_TEMP/govulncheck.json"
          fixable=$(jq -sc '[.[] | select(.finding and .finding.trace[0].function != null
            and (.finding.fixed_version // "") != "") | .finding.osv] | unique' "$RUNNER_TEMP/govulncheck.json")
          echo "Fixable vulnerabilities in the binary: $fixable"
          echo "fixable=$fixable" >> "$GITHUB_OUTPUT"

      # Tags publish as themselves; scheduled and manual runs publish a Caddy
      # release that has no image yet.
      - name: Choose the image tag to publish
        id: publish
        env:
          CADDY_VERSION: ${{ steps.caddy.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! docker buildx imagetools inspect "$IMAGE_NAME:$CADDY_VERSION" > /dev/null 2>&1; then
              echo "tag=$CADDY_VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.tag
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push the scanned image
        if: steps.publish.outputs.tag
        id: push
        env:
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -o pipefail
          docker tag caddy-cloudflare:build "$IMAGE_NAME:$TAG"
          digest=$(docker push "$IMAGE_NAME:$TAG" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.publish.outputs.tag
        with:
          # Verifiers use cosign v2, which reads this signature format.
          cosign-release: v2.6.5

      - name: Sign image
        if: steps.publish.outputs.tag
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --recursive --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cosign verify --insecure-ignore-tlog=true --key "$RUNNER_TEMP/cosign.pub" "$IMAGE" > /dev/null

      # latest only ever points at a signed digest.
      - name: Publish latest
        if: steps.publish.outputs.tag
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE"

      # Publishing does not wait for a fix, but the run still fails so the
      # finding is reported.
      - name: Report Go vulnerabilities
        if: steps.govulncheck.outputs.fixable != '[]'
        env:
          FIXABLE: ${{ steps.govulncheck.outputs.fixable }}
        run: |
          echo "::error::govulncheck found fixable vulnerabilities in the Caddy binary: $FIXABLE"
          exit 1
